name: CPU contracts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch==2.9.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e 'buffer[test]'
      - run: python -m pip install -e terminus
      - run: python -B scripts/check_release.py
      - run: python -m pytest -q
      - run: ruff check buffer/src scripts slime/compactionrl/scripts slime/compactionrl/tests terminus/scripts terminus/tests buffer/tests terminus/src terminus/server slime/slime --select F821,F822
      - run: python -m compileall -q buffer/src scripts terminus/src slime/slime
