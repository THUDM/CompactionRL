[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compactionrl"
version = "0.1.0"
description = "Minimal rollout buffer for CompactionRL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pyyaml>=6", "pydantic>=2.10"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.12"]
runtime = ["transformers>=4.57", "torch>=2.6"]

[project.scripts]
compactionrl-buffer = "compactionrl.buffer.service:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["compactionrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
